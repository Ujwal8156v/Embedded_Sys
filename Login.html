<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: url'C:\Users\ujwal\OneDrive\Desktop\Embedded Domain\Webpage/brackground.png' no-repeat center center fixed;
    background-size: cover;
}

form {
    border: 3px solid #f1f1f1;
    width: 350px;
    margin: 50px auto;
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.imgcontainer {
    text-align: center;
    margin: 20px 0;
}

img.avatar {
    width: 120px;
    border-radius: 50%;
}

.container {
    padding: 16px;
}

label {
    font-weight: bold;
}

input[type=text],
input[type=password] {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px 0;
    display: inline-block;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    background: #04AA6D;
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #038857;
}

.cancelbtn {
    width: auto;
    padding: 10px 18px;
    background: #f44336;
}

.bottom {
    background: #f1f1f1;
    padding: 16px;
    margin-top: 15px;
    overflow: auto;
}

.psw {
    float: right;
    margin-top: 10px;
}
</style>

</head>

<body>

<form action="Embedded.html">

<div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
    <a href="index.html" style="color: #04AA6D; text-decoration: none; font-size: 13px; font-weight: bold;">🏠 Domain Home</a>
    <a href="Embedded.html" style="color: #04AA6D; text-decoration: none; font-size: 13px; font-weight: bold;">Embedded Hub →</a>
</div>

<div class="imgcontainer">
    <img src="img_avatar2.png" alt="Avatar" class="avatar">
</div>

<div class="container">

    <label>Username</label>
    <input type="text" placeholder="Enter Username" required>

    <label>Password</label>
    <input type="password" placeholder="Enter Password" required>

    <button type="submit">Login</button>

    <p>
        <input type="checkbox" checked>
        Remember me
    </p>

</div>

<div class="bottom">

    <button type="button" class="cancelbtn">Cancel</button>

    <span class="psw">
        <a href="#">Forgot Password?</a>
    </span>

</div>

</form>

</body>
</html>
